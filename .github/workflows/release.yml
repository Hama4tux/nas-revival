# Release build on a tag v<YYYY.MM.DD[.N]> (docs/RELEASE.md, ADR 0017).
# Builds kernel, modules, the nas-revival binary, manifest, BUILDINFO and SHA256SUMS reproducibly and attaches
# them to a DRAFT release. Nothing is signed here and CI holds no key: the owner rebuilds locally, compares
# the hashes and signs with scripts/release/sign-release.sh, then publishes the draft.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (reproducible)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # The same distribution as the owner's workstation, so the cross compiler gives the same bytes.
    container:
      image: ubuntu:26.04@sha256:d66b366dac61b575bee2aef07e9c26e8070096fbe84a3d4d3eb0da069b5d76db
    steps:
      - name: Build tools
        run: |
          apt-get update -q
          DEBIAN_FRONTEND=noninteractive apt-get install -yq --no-install-recommends \
            build-essential bc bison flex libssl-dev kmod cpio xz-utils curl ca-certificates git \
            gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi libc6-dev-armel-cross u-boot-tools
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: backend/go.mod
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Build release
        env:
          REF: ${{ github.ref_name }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          ver="${REF#v}"
          if [ "$GITHUB_REF_TYPE" != tag ]; then ver="$(date -u +%Y.%m.%d)"; export ALLOW_DIRTY=1; fi
          OUT="$PWD/release-out" scripts/release/release.sh "$ver"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: release-out/
          if-no-files-found: error

  draft:
    name: Draft release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release-out
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "NAS Revival ${TAG#v}" \
            --notes "Unsigned until the owner's local rebuild matches and manifest.json.sig is attached (docs/RELEASE.md)." \
            release-out/*
