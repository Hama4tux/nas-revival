# /etc/systemd/journald.conf.d/50-nas-revival.conf
# The journal shares the only disk with the data (ADR 0007): flush non-critical
# messages every 15 min instead of 5 (crit/alert/emerg are still synced at once)
# and cap the persistent journal so it cannot fill the root filesystem.
[Journal]
SyncIntervalSec=15min
SystemMaxUse=64M
