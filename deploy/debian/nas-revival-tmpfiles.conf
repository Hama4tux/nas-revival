# Heavy-job lock shared by the scheduled tasks and the backup pull job (flock, W3.3).
# Created by root: the sticky /run/lock (fs.protected_regular) would keep other users
# from opening a file the task runner created itself.
f /run/lock/nas-heavy.lock 0660 root nas-heavy -
# Also fix owner and mode when the file already exists (e.g. created earlier by another job).
z /run/lock/nas-heavy.lock 0660 root nas-heavy -
