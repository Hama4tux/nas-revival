<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="NAS Revival – a second life for old NAS hardware">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07131a"/>
      <stop offset="0.55" stop-color="#0b1f26"/>
      <stop offset="1" stop-color="#062a2a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="case" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1c2a33"/>
      <stop offset="1" stop-color="#0e171d"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ecfeff"/>
      <stop offset="1" stop-color="#5eead4"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#5eead4" stroke-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1280" height="360" rx="20" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="20" fill="url(#grid)"/>
  <rect width="1280" height="360" rx="20" fill="url(#glow)"/>

  <g font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="72" y="96" fill="#5eead4" font-size="18" font-weight="600" letter-spacing="4">ZYXEL NSA310 · DEBIAN 13 · LINUX 6.12 LTS</text>
    <text x="68" y="182" fill="url(#title)" font-size="88" font-weight="800" letter-spacing="-2">NAS Revival</text>
    <text x="72" y="232" fill="#cbd5e1" font-size="28">A second life for old NAS hardware.</text>
    <g font-size="17" font-weight="600">
      <rect x="72" y="270" width="176" height="38" rx="19" fill="#2dd4bf" fill-opacity="0.12" stroke="#2dd4bf" stroke-opacity="0.45"/>
      <text x="160" y="295" fill="#99f6e4" text-anchor="middle">Modern web admin</text>
      <rect x="262" y="270" width="172" height="38" rx="19" fill="#2dd4bf" fill-opacity="0.12" stroke="#2dd4bf" stroke-opacity="0.45"/>
      <text x="348" y="295" fill="#99f6e4" text-anchor="middle">~20 MB of RAM</text>
      <rect x="448" y="270" width="204" height="38" rx="19" fill="#2dd4bf" fill-opacity="0.12" stroke="#2dd4bf" stroke-opacity="0.45"/>
      <text x="550" y="295" fill="#99f6e4" text-anchor="middle">Dual kernel slots</text>
      <rect x="666" y="270" width="150" height="38" rx="19" fill="#2dd4bf" fill-opacity="0.12" stroke="#2dd4bf" stroke-opacity="0.45"/>
      <text x="741" y="295" fill="#99f6e4" text-anchor="middle">No cloud</text>
    </g>
  </g>

  <!-- stylised NSA310 -->
  <g transform="translate(980 52)">
    <ellipse cx="96" cy="262" rx="120" ry="12" fill="#000" opacity="0.45"/>
    <rect x="0" y="0" width="192" height="256" rx="18" fill="url(#case)" stroke="#2b3b45" stroke-width="2"/>
    <rect x="22" y="24" width="118" height="96" rx="8" fill="#0a1117" stroke="#22313a"/>
    <rect x="22" y="136" width="118" height="96" rx="8" fill="#0a1117" stroke="#22313a"/>
    <g stroke="#1f2c35" stroke-width="3">
      <path d="M36 48h90M36 64h90M36 80h90M36 96h90"/>
      <path d="M36 160h90M36 176h90M36 192h90M36 208h90"/>
    </g>
    <circle cx="164" cy="38" r="11" fill="none" stroke="#38bdf8" stroke-width="3"/>
    <circle cx="164" cy="72" r="5" fill="#22c55e"/>
    <circle cx="164" cy="94" r="5" fill="#2dd4bf"/>
    <circle cx="164" cy="116" r="5" fill="#2dd4bf" opacity="0.6"/>
    <circle cx="164" cy="138" r="5" fill="#38bdf8" opacity="0.5"/>
    <circle cx="164" cy="72" r="12" fill="#22c55e" opacity="0.18"/>
  </g>
</svg>
