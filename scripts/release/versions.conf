# Pinned inputs of a NAS Revival release; the only place to change them (scripts/release/release.sh,
# scripts/debian/build-kernel.sh). Plain KEY=value lines, sourced by bash.
# Mainline LTS kernel from cdn.kernel.org (checked against its sha256sums.asc).
KERNEL_VERSION=6.12.119
# Own release suffix, so modules of a new build never overwrite those of the kernel in slot B.
KERNEL_LOCALVERSION=-nr1
